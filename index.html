<!DOCTYPE html>
<html lang="mn">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Холбоо барих | Fashion Shop</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav class="navbar border-bottom bg-white py-3">
		<div class="container">
			<a class="navbar-brand fw-bold text-dark fs-4" href="index.html">FASHION SHOP</a>
			<a class="nav-link text-dark" href="https://uc-sale.github.io/fashion-shop-store/">Нүүр хуудас</a>
		</div>
	</nav>

	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-12 col-md-8 col-lg-6">
				<h1 class="h2 fw-bold mb-2">Холбоо барих</h1>
				<p class="text-muted mb-4">support@fashionshop.mn</p>

				<form action="action_page.php" method="post" class="bg-white border rounded p-4">
					<div class="mb-3">
						<label for="fname" class="form-label">Овог</label>
						<input type="text" class="form-control" id="fname" name="firstname" placeholder="Овгоо бичнэ үү" required>
					</div>
					<div class="mb-3">
						<label for="lname" class="form-label">Нэр</label>
						<input type="text" class="form-control" id="lname" name="lastname" placeholder="Нэрээ бичнэ үү" required>
					</div>
					<div class="mb-3">
						<label for="country" class="form-label">Улс</label>
						<select id="country" name="country" class="form-select">
							<option value="mongolia">Монгол</option>
							<option value="china">Хятад</option>
							<option value="russia">Орос</option>
						</select>
					</div>
					<div class="mb-3">
						<label for="subject" class="form-label">Зурвас</label>
						<textarea id="subject" name="subject" class="form-control" rows="5" placeholder="Зурвасаа бичнэ үү" required></textarea>
					</div>
					<button type="submit" class="btn btn-dark">Илгээх</button>
				</form>
			</div>
		</div>
	</main>
</body>
</html>
